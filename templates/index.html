<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Raglooker</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <div class="shell">

      <header class="hero">
        <p class="eyebrow">Game Recommender</p>
        <h1>Find your next game</h1>
      </header>

      <aside class="sidebar">
        <form id="search-form">
          <label for="query" class="label">Type your game description here</label>
          <textarea
            id="query"
            name="query"
            rows="6"
            placeholder="e.g. I want a cozy card game with simple mechanics and a fun vibe..."
            required
          ></textarea>
          <div class="actions">
            <button type="submit" id="submit-button">Find matches</button>
            <p id="status" class="status">Ready.</p>
          </div>
        </form>
      </aside>

      <main class="main">
        <article class="panel answer-panel">
          <h2>LLM answer</h2>
          <div id="answer" class="answer-copy">
            Your personal recommendation assistant will explain its recommendations in more detail here.
          </div>
        </article>

        <article class="panel matches-panel">
          <div class="panel-header">
            <h2>Matches</h2>
            <span id="match-count" class="badge">0</span>
          </div>
          <div id="matches" class="matches"></div>
        </article>
      </main>

    </div>

    <template id="match-template">
      <article class="match-card">
        <img class="match-image" alt="">
        <div class="match-body">
          <div class="match-top">
            <h3 class="match-title"></h3>
            <span class="match-score"></span>
          </div>
          <p class="match-description"></p>
          <p class="match-meta"></p>
          <div class="match-tags"></div>
          <a class="match-link" target="_blank" rel="noreferrer">Open Steam page</a>
        </div>
      </article>
    </template>

    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
  </body>
</html>
